apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-try.apiName" . }}
  labels:
    app.kubernetes.io/name: api
    {{- include "helm-try.selectorLabels" . | nindent 4 }}
    {{- include "helm-try.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: api
    {{- include "helm-try.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
